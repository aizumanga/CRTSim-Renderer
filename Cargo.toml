[workspace]
members = ["crates/crtsim-core", "crates/crtsim-bevy", "crates/crtsim-cli", "crates/crtsim-app", "crates/crtsim-media", "crates/crtsim-ports", "crates/crtsim-shader-ports", "crates/crtsim-service", "crates/crtsim-plugin", "crates/crtsim-ofx", "crates/crtsim-frei0r"]
resolver = "2"

[workspace.package]
version = "1.8.3"
edition = "2021"
license = "CC0-1.0"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wgpu = "30.0.1"
