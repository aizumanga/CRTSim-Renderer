name: Publish crtsim-core
# crtsim-core is versioned with the app, so each release publishes its crate. A crate version
# cannot be taken back, so this runs when a person publishes the release, not when its tag is
# pushed, and leaves a version crates.io already has as it is. The first version is published by
# hand; later ones here, through crates.io's trusted publishing, which needs no stored token.
# See docs/RELEASES.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: The published release whose crate to publish, such as v1.5.0
        required: true
permissions:
  contents: read
concurrency:
  group: publish-core
  cancel-in-progress: false
jobs:
  publish:
    # Pre-releases are left off crates.io.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag names the crate's version, which crates.io does not have yet
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c "import json, sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'crtsim-core'))")"
          test "$RELEASE_TAG" = "v$version" || { echo "Tag $RELEASE_TAG does not name crtsim-core $version"; exit 1; }
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'crtsim-core publish workflow (github.com/aizumanga/CRTSim-Renderer)' "https://crates.io/api/v1/crates/crtsim-core/$version")"
          case "$status" in
            200) echo "crtsim-core $version is already on crates.io"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $status"; exit 1 ;;
          esac
      - if: steps.version.outputs.publish == 'true'
        run: cargo test --locked -p crtsim-core
      - if: steps.version.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.version.outputs.publish == 'true'
        run: cargo publish --locked -p crtsim-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
