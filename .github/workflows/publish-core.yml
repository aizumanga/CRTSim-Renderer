name: Publish crtsim-core
# crtsim-core is versioned on its own (see its Cargo.toml), so it is published from a tag of its
# own, crtsim-core-v0.1.0 and so on, never from the app's release tags. The first version is
# published by hand; later ones here, through crates.io's trusted publishing, which needs no
# stored token. See docs/RELEASES.md.
on:
  push:
    tags: ['crtsim-core-v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag names the crate's version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c "import json, sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'crtsim-core'))")"
          test "$REF_NAME" = "crtsim-core-v$version" || { echo "Tag $REF_NAME does not name crtsim-core $version"; exit 1; }
      - run: cargo test --locked -p crtsim-core
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked -p crtsim-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
