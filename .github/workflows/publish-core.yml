name: Publish crtsim-core and crtsim-bevy
# crtsim-core and crtsim-bevy are versioned with the app, so each release publishes its crates:
# the renderer first, then the Bevy plugin, which draws with that release's renderer. A crate
# version cannot be taken back, so this runs when a person publishes the release, not when its
# tag is pushed, and leaves a version crates.io already has as it is. Each crate's first version
# is published by hand; later ones here, through crates.io's trusted publishing, which needs no
# stored token. The file keeps its name, which each crate's trusted publisher names. See
# docs/RELEASES.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: The published release whose crates to publish, such as v1.6.0
        required: true
permissions:
  contents: read
concurrency:
  group: publish-core
  cancel-in-progress: false
jobs:
  publish:
    # Pre-releases are left off crates.io.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag names the crates' version, which crates.io does not have yet
        id: version
        shell: bash
        run: |
          for crate in crtsim-core crtsim-bevy; do
            version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c "import json, sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == '$crate'))")"
            test "$RELEASE_TAG" = "v$version" || { echo "Tag $RELEASE_TAG does not name $crate $version"; exit 1; }
            agent='crtsim-core publish workflow (github.com/aizumanga/CRTSim-Renderer)'
            key="${crate#crtsim-}"
            # Trusted publishing cannot make a crate, so a crate's first version is a person's.
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -A "$agent" "https://crates.io/api/v1/crates/$crate")" = 404 ]; then
              echo "::warning::$crate is not on crates.io yet: publish its first version by hand, as docs/RELEASES.md says"
              echo "$key=false" >> "$GITHUB_OUTPUT"
              continue
            fi
            status="$(curl -s -o /dev/null -w '%{http_code}' -A "$agent" "https://crates.io/api/v1/crates/$crate/$version")"
            case "$status" in
              200) echo "$crate $version is already on crates.io"; echo "$key=false" >> "$GITHUB_OUTPUT" ;;
              404) echo "$key=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "crates.io answered $status for $crate"; exit 1 ;;
            esac
          done
      - if: steps.version.outputs.core == 'true' || steps.version.outputs.bevy == 'true'
        run: cargo test --locked -p crtsim-core -p crtsim-bevy
      - if: steps.version.outputs.core == 'true' || steps.version.outputs.bevy == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.version.outputs.core == 'true'
        run: cargo publish --locked -p crtsim-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # Cargo waits for the renderer to be in the index before it publishes the plugin on it.
      - if: steps.version.outputs.bevy == 'true'
        run: cargo publish --locked -p crtsim-bevy
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
