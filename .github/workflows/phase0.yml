name: Renderer and desktop validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request replaces its checks in progress; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Pull requests start from main's build cache; only main saves one, so branches do not
      # crowd each other out of the repository's cache space.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux windowing development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      # crtsim-ports, the shader ports' test harness, builds librashader and its C++ shader
      # compilers; the Vulkan job below builds and runs it once, on Linux.
      - run: cargo test --workspace --exclude crtsim-ports --locked
      - run: cargo clippy --workspace --exclude crtsim-ports --all-targets --locked -- -D warnings
      # The web app: core and the app, as a browser builds them. Media's FFmpeg code compiles
      # there too but never runs, so it is left out.
      - name: Web app compiles for the browser
        if: runner.os == 'Linux'
        run: cargo clippy --locked --target wasm32-unknown-unknown -p crtsim-core -p crtsim-shader-ports -p crtsim-app --no-deps -- -D warnings
      # A Bevy game in a browser draws with the plugin too.
      - name: The Bevy plugin compiles for the browser
        if: runner.os == 'Linux'
        run: cargo clippy --locked --target wasm32-unknown-unknown -p crtsim-bevy --no-deps -- -D warnings
      # crtsim-core and crtsim-bevy are published on crates.io: each must package, and build
      # from its package alone, with nothing from outside its folder; the plugin builds on the
      # renderer's package.
      - name: crtsim-core and crtsim-bevy package for crates.io
        if: runner.os == 'Linux'
        run: cargo package --locked -p crtsim-core -p crtsim-bevy
      - run: cargo run --locked -p crtsim-cli -- inspect-meshes
      - run: python tools/verify_assets.py
      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --all
          git diff --exit-code > formatting.patch
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: rustfmt-patch
          path: formatting.patch
  # The oldest Rust crtsim-core says it builds with, in its Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked -p crtsim-core
  vulkan:
    runs-on: ubuntu-latest
    env:
      XDG_RUNTIME_DIR: /tmp
      CRTSIM_TEST_OUTPUT: ${{ github.workspace }}/output
      CRTSIM_DATA_DIR: ${{ github.workspace }}/output/app-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install software Vulkan driver
        run: sudo apt-get update -qq && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev xvfb ffmpeg
      - run: cargo test --locked -p crtsim-core gpu_smoke -- --ignored --nocapture
      - name: GPU prepare step against the CPU implementation
        run: cargo test --locked -p crtsim-core gpu_prepare_matches_cpu_prepare -- --ignored --nocapture
      - name: A host's frames, recorded into its own encoder
        run: cargo test --locked -p crtsim-core a_host_frame -- --ignored --nocapture
      - name: Bevy cameras drawn through the CRT, in a Bevy app with no window
        run: cargo test --locked -p crtsim-bevy --test headless -- --ignored --nocapture
      - name: The render service, spoken to over HTTP
        run: cargo test --locked -p crtsim-service --test service -- --ignored --nocapture
      - name: Golden-image rendering regression
        run: cargo test --locked -p crtsim-core --test golden -- --ignored --nocapture
      - name: RetroArch port against the renderer, through librashader
        run: |
          cargo clippy --locked -p crtsim-ports --all-targets -- -D warnings
          cargo test --locked -p crtsim-ports --test harness --test retroarch_parity -- --ignored --nocapture
      # OBS's development files, and the source of vkBasalt, whose package carries ReShade's own
      # effect compiler.
      - name: Install OBS and ReShade's compiler
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo apt-get install -y libobs-dev libgl1-mesa-dri spirv-headers spirv-tools
          mkdir -p build/vkbasalt
          (cd build/vkbasalt && apt-get source -qq vkbasalt)
      - name: ReShade port compiles as every shipped look sets it, with ReShade's compiler
        run: |
          tools/reshadefx/build.sh build/vkbasalt/vkbasalt-*/ build/reshadefx-check
          cargo run --locked -p crtsim-cli -- export-reshade --output-dir build/reshade
          python3 tools/reshadefx/check_presets.py build/reshadefx-check build/reshade
      - name: OBS filter against the renderer, in OBS itself
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CRTSIM_OBS_BUILD: ${{ github.workspace }}/build/obs
        run: |
          cmake -S ports/obs -B build/obs -DCRTSIM_OBS_TEST=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build/obs
          xvfb-run -a cargo test --locked -p crtsim-ports --test obs_parity -- --ignored --nocapture
      # Godot's own build, checked against the checksums its release publishes.
      - name: Godot effect against the renderer, in Godot itself
        env:
          GODOT_VERSION: 4.7.2-stable
        run: |
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          mkdir -p build/godot && cd build/godot
          curl --fail --location --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " Godot_v${GODOT_VERSION}_linux.x86_64.zip$" SHA512-SUMS.txt | sed 's/  .*/  godot.zip/' | sha512sum -c
          unzip -q godot.zip
          cd ../..
          CRTSIM_GODOT="$PWD/build/godot/Godot_v${GODOT_VERSION}_linux.x86_64" xvfb-run -a cargo test --locked -p crtsim-ports --test godot_parity -- --ignored --nocapture
      - name: Video history, FFmpeg and audio integration
        run: |
          cargo test --locked -p crtsim-core video_history -- --ignored --nocapture
          cargo test --locked -p crtsim-core a_video_keeps_its_glow_at_a_new_output_size -- --ignored --nocapture
          cargo test --locked -p crtsim-core interlaced_ticks_scan_alternate_fields -- --ignored --nocapture
          cargo test --locked -p crtsim-core an_editing_sequence_follows_edits -- --ignored --nocapture
          cargo test --locked -p crtsim-media --test video -- --ignored --nocapture --test-threads=1
          cargo test --locked -p crtsim-app a_preview_finishes_while_an_export_is_still_running -- --ignored --nocapture
          cargo test --locked -p crtsim-app interactive_previews_run_on_and_a_settled_one_is_a_still -- --ignored --nocapture
          cargo test --locked -p crtsim-app a_video_plays_through_the_worker_to_its_end -- --ignored --nocapture
          cargo test --locked -p crtsim-app edits_while_playing_reach_the_next_frames_without_stopping -- --ignored --nocapture
          cargo test --locked -p crtsim-app a_contact_sheet_is_saved_with_a_tile_for_each_look -- --ignored --nocapture
      - name: Render resolution and phase fixtures
        shell: bash
        run: |
          mkdir -p output
          cargo run --locked -p crtsim-cli -- render -o output/reference.png --debug-dir output/debug --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/720p.png --size 720p --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/1080p.png --size 1080p --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/4k.png --size 4k --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/phase-a.png --phase a --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/phase-b.png --phase b --backend vulkan
          cargo run --locked -p crtsim-cli -- config --general -o output/general.json
          cargo run --locked -p crtsim-cli -- render -i output/4k.png --config output/general.json -o output/auto.png --debug-dir output/auto-debug --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/ntsc-240p.png --preset "NTSC 240p" --backend vulkan
          cargo run --locked -p crtsim-cli -- contact-sheet -o output/contact-sheet.png --backend vulkan
          # The video integration tests leave their input here.
          cargo run --locked -p crtsim-cli -- render -i output/video-input.mkv -o output/cli-video.mp4 --size 320x240 --backend vulkan
          cargo run --locked -p crtsim-cli -- render -i output/video-input.mkv -o output/cli-lossless.mkv --size 320x240 --quality lossless --backend vulkan
          cargo run --locked -p crtsim-cli -- render -i output/video-input.mkv -o output/cli-animation.png --max-side 320 --backend vulkan
      - name: Launch desktop and capture rendered preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- --backend vulkan --smoke-test output/desktop.png
          mkdir -p "$CRTSIM_DATA_DIR"
          echo 'sky-diary' > "$CRTSIM_DATA_DIR/theme-v1.txt"
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- --smoke-test output/welcome.png --smoke-welcome
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- --backend vulkan --smoke-test output/first-look.png --smoke-first-look
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- --backend vulkan --smoke-test output/phone.png --smoke-size 390x844
          mkdir -p "$CRTSIM_DATA_DIR/presets"
          cp output/general.json "$CRTSIM_DATA_DIR/presets/Animation CRT.json"
          echo 'A personal description for animation, with a soft mask and gentle bloom.' > "$CRTSIM_DATA_DIR/presets/Animation CRT.txt"
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- --backend vulkan --smoke-test output/gallery.png --smoke-gallery
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- --backend vulkan --smoke-test output/lut-gallery.png --smoke-lut-gallery
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- output/video-input.mkv --backend vulkan --smoke-test output/video-desktop.png
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- output/video-input.mkv --backend vulkan --smoke-test output/video-export-window.png --smoke-export
          ffmpeg -v error -f lavfi -i testsrc2=size=160x120:rate=10 -t 1 -c:v gif -loop 0 output/animation-input.gif
          xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-app -- output/animation-input.gif --backend vulkan --smoke-test output/animation-desktop.png
      - uses: actions/upload-artifact@v4
        # Runs on failure too: a golden mismatch writes its rendered and diff images here.
        if: always()
        with:
          name: renderer-fixtures
          path: output/
          retention-days: 14
