name: Renderer and desktop validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux windowing development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p crtsim-cli -- inspect-meshes
      - run: python tools/verify_assets.py
  vulkan:
    runs-on: ubuntu-latest
    env:
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install software Vulkan driver
        run: sudo apt-get update -qq && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev xvfb
      - run: cargo test --locked -p crtsim-core gpu_smoke -- --ignored --nocapture
      - name: Render resolution and phase fixtures
        shell: bash
        run: |
          mkdir -p output
          cargo run --locked -p crtsim-cli -- render -o output/reference.png --debug-dir output/debug --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/720p.png --size 720p --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/1080p.png --size 1080p --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/4k.png --size 4k --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/phase-a.png --phase a --backend vulkan
          cargo run --locked -p crtsim-cli -- render -o output/phase-b.png --phase b --backend vulkan
          cargo run --locked -p crtsim-cli -- config --general -o output/general.json
          cargo run --locked -p crtsim-cli -- render -i output/4k.png --config output/general.json -o output/auto.png --debug-dir output/auto-debug --backend vulkan
      - name: Launch desktop and capture rendered preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: xvfb-run -a -s '-screen 0 1440x1000x24' cargo run --locked -p crtsim-desktop -- --backend vulkan --smoke-test output/desktop.png
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-render-fixtures
          path: output/
          retention-days: 14
