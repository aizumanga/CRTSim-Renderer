name: Portable packages
on:
  # Pull requests are built, tested and linted on every system by the validation workflow, so
  # packages are built for one only when it changes how they are made or what goes into them.
  # A preview of any commit can still be built by running this workflow by hand.
  pull_request:
    paths:
      - .github/workflows/releases.yml
      - tools/package.py
      - tools/build_web.py
      - packaging/**
      - ports/**
      - web/**
      - Cargo.lock
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Add the web app to this existing release, such as v0.7.0. Leave empty to build every package as a preview.
        required: false
        default: ''
permissions:
  contents: read
# A new push to a pull request replaces its checks in progress; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    # Adding the web app to an existing release leaves its desktop packages as they are.
    if: inputs.release_tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev mesa-vulkan-drivers xvfb ffmpeg
      - name: Static Windows C runtime
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      # Pull requests are tested on these same systems by the validation workflow, so only
      # tagged and manual builds test again here before packaging.
      - name: Test
        if: github.event_name != 'pull_request'
        run: cargo test --workspace --exclude crtsim-ports --locked
      - name: Build
        run: cargo build --release --locked -p crtsim-app -p crtsim-cli
      - name: Package binaries and licenses
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="$REF_NAME"
          else
            version="preview-${GITHUB_SHA:0:8}"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          python tools/package.py --platform "$PACKAGE_PLATFORM" --version "$version"
          # The RetroArch presets are the same on every system, so one build writes them.
          if [ "$PACKAGE_PLATFORM" = linux-x86_64 ]; then
            python tools/package.py --platform retroarch --version "$version"
          fi
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          curl --fail --location --retry 3 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          sha256sum linuxdeploy.AppImage > dist/linuxdeploy-tool.sha256
          export OUTPUT="$PWD/dist/CRTSim-Renderer-${PACKAGE_VERSION}-linux-x86_64.AppImage"
          ./linuxdeploy.AppImage --appdir dist/AppDir --executable target/release/crtsim-desktop --executable target/release/crtsim --desktop-file packaging/crtsim-renderer.desktop --icon-file packaging/crtsim-renderer.svg --library /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0 --library /usr/lib/x86_64-linux-gnu/libwayland-client.so.0 --custom-apprun packaging/AppRun --output appimage
      - name: Smoke-test packaged Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          XDG_RUNTIME_DIR: /tmp
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: |
          mkdir -p package-smoke
          ./dist/*.AppImage --cli inspect-meshes
          xvfb-run -a -s '-screen 0 1440x1000x24' ./dist/*.AppImage --backend vulkan --smoke-test "$PWD/package-smoke/desktop.png"
          ffmpeg -v error -f lavfi -i testsrc2=size=64x48:rate=30 -t 0.2 -c:v libx264 package-smoke/input.mkv
          xvfb-run -a -s '-screen 0 1440x1000x24' ./dist/*.AppImage "$PWD/package-smoke/input.mkv" --backend vulkan --smoke-test "$PWD/package-smoke/video.png"
      - name: Package checksums
        shell: bash
        run: python -c "from pathlib import Path; import hashlib; p=Path('dist'); fs=sorted(f for f in p.iterdir() if f.is_file() and (f.suffix in ('.zip','.AppImage') or f.name.endswith('.tar.gz'))); (p/'SHA256SUMS-${{ matrix.platform }}.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in fs))"
      - uses: actions/upload-artifact@v4
        with:
          name: CRTSim-Renderer-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.txt
            dist/*.sha256
            package-smoke/*.png
          if-no-files-found: error
          retention-days: 14
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      # A release published before its web package existed has an older tools/package.py, so
      # the package is made with this workflow's own tools from the tag's build.
      - uses: actions/checkout@v4
        with:
          path: workflow-tools
          sparse-checkout: tools/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen's command line must match the crate version Cargo.lock pins; the cache
      # keeps it installed between runs.
      - name: Install wasm-bindgen
        shell: bash
        run: |
          pinned="$(python -c "import re; print(re.search(r'name = \"wasm-bindgen\"\nversion = \"([^\"]+)\"', open('Cargo.lock').read()).group(1))")"
          cargo install wasm-bindgen-cli --version "$pinned" --locked
      - name: Build the web app
        run: python tools/build_web.py
      - name: Package the web app
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="$RELEASE_TAG"
          elif [ "$REF_TYPE" = tag ]; then
            version="$REF_NAME"
          else
            version="preview-${GITHUB_SHA:0:8}"
          fi
          python workflow-tools/tools/package.py --platform web --version "$version"
          cd dist && sha256sum -- *-web.zip > SHA256SUMS-web.txt && cat SHA256SUMS-web.txt
      - uses: actions/upload-artifact@v4
        with:
          name: web-package
          path: |
            dist/*-web.zip
            dist/SHA256SUMS-web.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CRTSim-Renderer-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: web-package
          path: packages/dist
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CRTSim Renderer $RELEASE_TAG" --notes 'Portable desktop and CLI packages, the web app the site serves, and the CRT as RetroArch shader presets. See the included README and docs/RELEASES.md. Video requires a separate FFmpeg/ffprobe installation. macOS is ad-hoc signed only, without Apple Developer ID signing or notarization.'
          fi
          gh release upload "$RELEASE_TAG" packages/dist/*.zip packages/dist/*.tar.gz packages/dist/*.AppImage packages/dist/SHA256SUMS-*.txt --clobber
  # The web app for a release published before its package existed, such as v0.7.0.
  add-web:
    if: inputs.release_tag != ''
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-package
          path: dist
      - name: Add the web app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/*-web.zip dist/SHA256SUMS-web.txt --clobber
