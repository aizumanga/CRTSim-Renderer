[package]
name = "crtsim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "crtsim"
path = "src/main.rs"

[dependencies]
crtsim-core = { path = "../crtsim-core" }
crtsim-shader-ports = { path = "../crtsim-shader-ports" }
# Videos and animations: FFmpeg runs as it does for the desktop, and GIF and WebP decode here.
crtsim-media = { path = "../crtsim-media" }
anyhow.workspace = true
image.workspace = true
serde_json.workspace = true
wgpu.workspace = true
pollster = "0.3"
clap = { version = "4", features = ["derive"] }
