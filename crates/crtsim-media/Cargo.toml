[package]
name = "crtsim-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
crtsim-core = { path = "../crtsim-core" }
image.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile = "3"
image-webp = "0.2"
# GIFs written without FFmpeg, as a browser page writes them.
gif = "0.13"
# Animated PNGs written without FFmpeg: each frame compressed as a still, the file put together
# with its checksums once the frames are counted.
png = "0.17"
crc32fast = "1"
# MP4 and MOV read without FFmpeg, as a browser page reads them.
re_mp4 = "0.5"
pollster = "0.3"
# A clock that works in a browser, where std's panics; std's elsewhere.
web-time = "1"

[dev-dependencies]
wgpu.workspace = true
